<div class="max-w-3xl animate-fade-in">
  <header class="mb-8">
    <h1 class="text-4xl font-bold text-white">Nuevo Aviso Oficial</h1>
    <p class="text-lg text-gray-400">La información publicada aquí será visible para toda la comunidad.</p>
  </header>

  <form (ngSubmit)="publicar()" #avisoForm="ngForm"
    class="bg-glass-bg backdrop-blur-lg rounded-xl shadow-2xl p-8 space-y-6 border border-white/5">

    <!-- Título -->
    <div>
      <label class="block text-sm font-bold text-gray-300 mb-2">Título del Aviso</label>
      <input type="text" [(ngModel)]="titulo" name="titulo" required
        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition placeholder-gray-500"
        placeholder="Ej. Suspensión de labores...">
    </div>

    <div class="grid grid-cols-2 gap-6">
      <!-- Categoría -->
      <div>
        <label class="block text-sm font-bold text-gray-300 mb-2">Categoría</label>
        <select [(ngModel)]="categoria" name="categoria"
          class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition [&>option]:bg-primary-dark cursor-pointer">
          <option>Académico</option>
          <option>Administrativo</option>
          <option>Cultural</option>
          <option>Urgente</option>
        </select>
      </div>
      <!-- Imagen -->
      <div>
        <label class="block text-sm font-bold text-gray-300 mb-2">Imagen (Opcional)</label>
        <input type="file" (change)="onFileSelected($event)"
          class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-white/10 file:text-white hover:file:bg-white/20 cursor-pointer transition">
      </div>
    </div>

    <!-- Contenido -->
    <div>
      <label class="block text-sm font-bold text-gray-300 mb-2">Contenido</label>
      <textarea rows="6" [(ngModel)]="contenido" name="contenido" required
        class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition placeholder-gray-500 resize-none"
        placeholder="Escribe el comunicado oficial aquí..."></textarea>
    </div>

    <!-- Botones de Acción -->
    <div class="flex justify-end gap-4 pt-4 border-t border-white/5">
      <button type="button" routerLink="/admin/dashboardAdmin"
        class="px-6 py-2 text-gray-400 hover:text-white transition font-medium">
        Cancelar
      </button>
      <button type="submit" [disabled]="!avisoForm.form.valid"
        class="bg-purple-600 text-white font-bold px-8 py-3 rounded-lg hover:bg-purple-500 transition shadow-lg shadow-purple-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
        Publicar Aviso
      </button>
    </div>
  </form>
</div>
