<header class="mb-8 animate-fade-in">
  <h1 class="text-4xl font-bold text-white">Cursos y Talleres</h1>
  <p class="text-lg text-gray-400">Desarrolla nuevas habilidades.</p>
</header>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in">
  @for (curso of cursosData; track curso.id) {
  <div class="bg-glass-bg backdrop-blur-lg rounded-xl shadow-2xl overflow-hidden hover:transform hover:-translate-y-1 transition duration-300">
    <div class="h-32 bg-gradient-to-r from-purple-600 to-indigo-600"></div>
    <div class="p-6">
      <span class="text-xs bg-white/10 text-white px-2 py-1 rounded mb-2 inline-block">{{curso.modalidad}}</span>
      <h3 class="text-xl font-bold text-white mb-2">{{curso.titulo}}</h3>
      <p class="text-gray-400 text-sm mb-4">Fecha: {{curso.fecha}}</p>
      <button class="w-full bg-white/10 hover:bg-white/20 text-white py-2 rounded-lg font-bold transition">Inscribirme</button>
    </div>
  </div>
  }
</div>
