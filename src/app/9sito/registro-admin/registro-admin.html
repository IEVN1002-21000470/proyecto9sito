<div class="login-container">
  <div class="info-section">
    <div class="logo">
      <img src="9sito.png" alt="Logo de 9C" class="logo-img">
    </div>
    <h1>Registro Administrativo</h1>
    <p class="subtitle">Crea tu cuenta para gestionar el portal.</p>
    <hr class="separator">

    <div class="access-info">
      <p>Tu rol de administrador permite:</p>
      <ul>
        <li><b>Publicar</b> noticias y comunicados oficiales.</li>
        <li><b>Modificar</b> contenido principal del portal.</li>
        <li><b>Gestionar</b> eventos y recursos académicos.</li>
      </ul>
    </div>
  </div>

  <div class="form-section">
    <div class="login-box">
      <div class="header-logo-form">
        <img src="9sito.png" alt="Logo de 9C" class="small-logo-img">
        <h2>Registro de Admin</h2>
      </div>

      <form action="#" method="POST">
        <label for="institutional-email" class="form-label">CORREO INSTITUCIONAL</label>
        <input type="email" id="institutional-email" name="email" required>

        <label for="unique-key" class="form-label">NOMBRE COMPLETO</label>
        <input type="text" id="unique-key" name="unique_key" required>

        <label for="password" class="form-label">CONTRASEÑA</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm-password" class="form-label">CONFIRMAR CONTRASEÑA</label>
        <input type="password" id="confirm-password" name="confirm_password" required>

        <button type="submit" class="login-button">Registrar Cuenta</button>
      </form>

      <div class="login-link">
        <a href="login.html">¿Ya tienes una cuenta? Iniciar sesión</a>
      </div>
    </div>
  </div>
</div>
