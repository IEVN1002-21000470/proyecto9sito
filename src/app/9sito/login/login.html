<div class="login-container">
  <div class="info-section">
    <div class="logo">
      <img src="9sito.png" alt="Logo de 9C" class="logo-img">
    </div>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Inicia sesión para continuar</p>
    <hr class="separator">

    <div class="access-info">
      <p>Tu acceso a:</p>
      <ul>
        <li><b>Noticias</b> oficiales y comunicados.</li>
        <li><b>Eventos exclusivos</b> de tu facultad.</li>
        <li><b>Información relevante</b> de tu comunidad académica.</li>
      </ul>
    </div>
  </div>

  <div class="form-section">
    <div class="login-box">
      <div class="header-logo-form">
        <img src="9sito.png" alt="Logo de 9C" class="small-logo-img">
        <h2>Inicia sesión</h2>
      </div>

      <form action="#" method="POST">
        <label for="institutional-email" class="form-label">CORREO INSTITUCIONAL</label>
        <input type="email" id="institutional-email" name="email" required>

        <label for="password" class="form-label">CONTRASEÑA</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="login-button">Iniciar sesión</button>
      </form>

      <div class="forgot-password">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </div>
</div>
